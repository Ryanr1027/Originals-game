<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Coalition Builder</title>
<style>
:root {
  --bg: #0f0e17;
  --bg2: #1a1828;
  --paper: #f0ebe0;
  --aged: #c8bfa8;
  --mute: #6a6070;
  --gold: #c9a227;
  --teal: #1a9a80;
  --red: #c0392b;
  --purple: #7060c0;
  --r: 8px;
}
*, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
html, body { height: 100%; }
body { background: var(--bg); color: var(--paper); font-family: system-ui, -apple-system, sans-serif; display: flex; align-items: center; justify-content: center; min-height: 100vh; padding: .75rem; }
#app { width: 100%; max-width: 680px; }

/* screens */
.scr { display: none; }
.scr.on { display: block; }

/* ── CHAR SELECT ── */
#char-scr { }
.char-intro { text-align: center; margin-bottom: 1.5rem; }
.char-intro h1 { font-size: clamp(1.6rem, 5vw, 2.6rem); font-weight: 800; letter-spacing: -.02em; color: var(--paper); line-height: 1; margin-bottom: .35rem; }
.char-intro h1 span { color: var(--gold); }
.char-intro p { font-size: 13px; color: var(--mute); }
.char-grid { display: grid; grid-template-columns: repeat(2, 1fr); gap: .6rem; margin-bottom: 1rem; }
@media(min-width:520px){ .char-grid { grid-template-columns: repeat(4,1fr); } }
.ccard { background: var(--bg2); border: 1.5px solid rgba(255,255,255,.08); border-radius: var(--r); padding: .85rem .75rem; cursor: pointer; transition: border-color .15s, background .15s; text-align: center; }
.ccard:hover { background: rgba(255,255,255,.05); border-color: rgba(255,255,255,.2); }
.ccard.sel { border-color: var(--gold); background: rgba(201,162,39,.08); }
.ccard-icon { font-size: 2rem; margin-bottom: .4rem; }
.ccard-name { font-size: 13px; font-weight: 700; color: var(--paper); margin-bottom: .2rem; }
.ccard-role { font-size: 10px; text-transform: uppercase; letter-spacing: .1em; color: var(--gold); margin-bottom: .4rem; }
.ccard-abi { font-size: 11px; color: var(--aged); line-height: 1.4; }
.start-row { text-align: center; }

/* ── HUD ── */
#hud { display: flex; align-items: center; gap: .6rem; padding: .6rem .75rem; background: var(--bg2); border-radius: var(--r); margin-bottom: .75rem; flex-wrap: wrap; border: 1px solid rgba(255,255,255,.06); }
.hb { flex: 1; min-width: 50px; }
.hb-lbl { font-size: 8px; text-transform: uppercase; letter-spacing: .14em; color: var(--mute); margin-bottom: 1px; }
.hb-val { font-size: 17px; font-weight: 800; }
.hb-val.gold { color: var(--gold); }
.bar-wrap { flex: 2; min-width: 100px; }
.bar-track { height: 4px; background: rgba(255,255,255,.08); border-radius: 2px; overflow: hidden; margin-top: 3px; }
.bar-fill { height: 100%; border-radius: 2px; transition: width .45s ease; }
.bar-fill.rad { background: linear-gradient(90deg, var(--red), var(--gold)); }
.bar-fill.pres { background: linear-gradient(90deg, #44304a, var(--red)); }
.char-pill { display: flex; align-items: center; gap: 5px; padding: 3px 9px; background: rgba(201,162,39,.1); border: 1px solid rgba(201,162,39,.22); border-radius: 20px; margin-left: auto; }
.char-pill span { font-size: 10px; color: var(--gold); font-weight: 700; }

/* ── ROUND ── */
.round-dots { display: flex; justify-content: center; gap: 5px; margin-bottom: .75rem; }
.rd { width: 7px; height: 7px; border-radius: 50%; background: rgba(255,255,255,.12); transition: background .3s; }
.rd.done { background: var(--gold); }
.rd.cur { background: var(--paper); }

.round-box { background: var(--bg2); border: 1px solid rgba(255,255,255,.07); border-radius: var(--r); padding: 1rem 1.1rem; margin-bottom: .65rem; }
.round-kicker { font-size: 10px; text-transform: uppercase; letter-spacing: .18em; color: var(--gold); margin-bottom: .3rem; }
.round-title { font-size: clamp(1.1rem, 3vw, 1.45rem); font-weight: 800; color: var(--paper); line-height: 1.15; margin-bottom: .45rem; }
.round-flavor { font-size: 13px; color: var(--aged); line-height: 1.6; }

/* pushback banner */
#pushback { display: none; background: rgba(192,57,43,.08); border: 1px solid rgba(192,57,43,.22); border-radius: var(--r); padding: .7rem 1rem; margin-bottom: .65rem; }
#pushback.on { display: block; }
.pb-lbl { font-size: 9px; text-transform: uppercase; letter-spacing: .16em; color: var(--red); margin-bottom: .35rem; }
.pb-txt { font-size: 13px; color: var(--aged); line-height: 1.55; margin-bottom: .55rem; }
.pb-btns { display: flex; gap: .45rem; flex-wrap: wrap; }
.pb-btn { background: rgba(255,255,255,.05); border: 1px solid rgba(255,255,255,.1); border-radius: 5px; padding: .38rem .75rem; font-size: 11px; color: var(--paper); cursor: pointer; transition: background .13s; font-family: inherit; }
.pb-btn:hover { background: rgba(255,255,255,.1); }
.pb-result { font-size: 11px; color: var(--aged); font-style: italic; margin-top: .45rem; display: none; }
.pb-result.on { display: block; }

/* newspaper */
#newspaper { display: none; background: #f4f0e8; border-radius: var(--r); padding: .85rem 1rem; margin-bottom: .65rem; position: relative; overflow: hidden; }
#newspaper.on { display: block; }
.np-flag { font-family: 'Times New Roman', serif; font-size: 10px; font-weight: 700; letter-spacing: .3em; text-transform: uppercase; color: #222; border-bottom: 2px double #222; padding-bottom: .3rem; margin-bottom: .3rem; }
.np-hl { font-family: 'Times New Roman', serif; font-size: clamp(.95rem, 2.5vw, 1.25rem); font-weight: 700; color: #111; line-height: 1.2; margin-bottom: .2rem; }
.np-sub { font-family: 'Times New Roman', serif; font-size: 12px; font-style: italic; color: #555; margin-bottom: .4rem; }
.np-body { font-family: 'Times New Roman', serif; font-size: 11px; color: #444; line-height: 1.55; }
.np-stamp { position: absolute; top: 8px; right: 8px; font-size: 9px; font-weight: 700; font-family: system-ui; padding: 2px 6px; border-radius: 3px; text-transform: uppercase; letter-spacing: .08em; }
.np-stamp.fav { background: #c8e6c9; color: #1b5e20; }
.np-stamp.hos { background: #ffcdd2; color: #b71c1c; }
.np-stamp.neu { background: #e8eaf6; color: #283593; }

/* faction map */
#faction-map { display: grid; grid-template-columns: repeat(3,1fr); gap: .45rem; margin-bottom: .65rem; }
.fcard { background: var(--bg2); border: 1.5px solid rgba(255,255,255,.07); border-radius: 6px; padding: .5rem .65rem; cursor: pointer; transition: border-color .15s, background .15s; }
.fcard:hover:not(.used) { border-color: rgba(255,255,255,.2); background: rgba(255,255,255,.04); }
.fcard.allied { border-color: var(--teal); background: rgba(26,154,128,.1); }
.fcard.hostile { border-color: var(--red); background: rgba(192,57,43,.08); }
.fcard.used { opacity: .5; cursor: default; }
.fcard-top { display: flex; align-items: center; gap: .4rem; margin-bottom: .3rem; }
.fcard-icon { font-size: 16px; }
.fcard-name { font-size: 11px; font-weight: 700; color: var(--paper); }
.fcard-status { font-size: 9px; color: var(--mute); }
.fcard-bar { height: 3px; background: rgba(255,255,255,.08); border-radius: 2px; overflow: hidden; }
.fcard-fill { height: 100%; background: var(--gold); border-radius: 2px; transition: width .45s; }

/* diplomacy modal */
#diplo { display: none; position: fixed; inset: 0; background: rgba(0,0,0,.75); z-index: 50; align-items: center; justify-content: center; padding: .75rem; }
#diplo.on { display: flex; }
.diplo-box { background: var(--bg2); border: 1px solid rgba(255,255,255,.13); border-radius: 12px; padding: 1.2rem 1.3rem; max-width: 460px; width: 100%; max-height: 88vh; overflow-y: auto; }
.diplo-head { display: flex; align-items: center; gap: .7rem; margin-bottom: .85rem; }
.diplo-ava { width: 44px; height: 44px; border-radius: 50%; display: flex; align-items: center; justify-content: center; font-size: 20px; }
.diplo-fname { font-size: 1.05rem; font-weight: 700; color: var(--paper); }
.diplo-fstatus { font-size: 11px; margin-top: 2px; }
.diplo-concern { font-size: 13px; font-style: italic; color: var(--aged); border-left: 2px solid var(--mute); padding: .45rem .75rem; line-height: 1.55; border-radius: 0 4px 4px 0; background: rgba(255,255,255,.03); margin-bottom: .85rem; }
.diplo-choices { display: flex; flex-direction: column; gap: .45rem; margin-bottom: .75rem; }
.dchoice { background: rgba(255,255,255,.04); border: 1px solid rgba(255,255,255,.1); border-radius: 6px; padding: .7rem .85rem; cursor: pointer; text-align: left; font-size: 13px; color: var(--paper); line-height: 1.5; transition: background .13s, border-color .13s; font-family: inherit; }
.dchoice:hover { background: rgba(255,255,255,.09); border-color: rgba(255,255,255,.22); }
.dchoice-tags { display: flex; gap: 4px; flex-wrap: wrap; margin-top: 5px; }
.dtag { font-size: 9px; font-weight: 700; text-transform: uppercase; letter-spacing: .08em; padding: 2px 5px; border-radius: 3px; }
.dtag-gold { background: rgba(201,162,39,.2); color: var(--gold); }
.dtag-rad  { background: rgba(192,57,43,.18); color: #e06050; }
.dtag-troj { background: rgba(112,96,192,.25); color: #b0a5e0; }
.dtag-tact { background: rgba(26,154,128,.2); color: #60c0a8; }
.dtag-eth  { background: rgba(26,154,128,.2); color: #60c0a8; }
.dtag-pat  { background: rgba(192,57,43,.18); color: #e06050; }
.dtag-log  { background: rgba(42,111,168,.2); color: #80b0e0; }
.diplo-result { display: none; font-size: 13px; color: var(--aged); line-height: 1.6; padding: .65rem .8rem; background: rgba(255,255,255,.04); border-radius: 6px; margin-bottom: .6rem; }
.diplo-result.on { display: block; }
.diplo-insight { display: none; font-size: 12px; font-style: italic; color: var(--aged); border-left: 2px solid var(--gold); padding: .45rem .75rem; border-radius: 0 4px 4px 0; background: rgba(201,162,39,.06); line-height: 1.5; margin-bottom: .6rem; }
.diplo-insight.on { display: block; }
.diplo-chips { display: flex; gap: .4rem; flex-wrap: wrap; margin-bottom: .6rem; }
.dchip { font-size: 10px; padding: 2px 7px; border-radius: 20px; font-weight: 700; }
.dchip.pos { background: rgba(26,154,128,.2); color: #60c0a8; }
.dchip.neg { background: rgba(192,57,43,.17); color: #e06050; }

/* choices */
.choices-lbl { font-size: 9px; text-transform: uppercase; letter-spacing: .15em; color: var(--mute); margin-bottom: .5rem; }
.choices { display: flex; flex-direction: column; gap: .5rem; }
.choice { background: var(--bg2); border: 1.5px solid rgba(255,255,255,.09); border-radius: var(--r); padding: .8rem 1rem; cursor: pointer; text-align: left; transition: background .13s, border-color .13s; position: relative; }
.choice:hover { background: rgba(255,255,255,.05); border-color: rgba(255,255,255,.22); }
.choice.boosted { border-color: rgba(201,162,39,.38); background: rgba(201,162,39,.05); }
.choice.boosted::after { content: '★'; position: absolute; top: 8px; right: 10px; font-size: 11px; color: var(--gold); }
.choice-letter { font-size: 10px; font-weight: 800; color: var(--gold); margin-right: .35rem; }
.choice-text { font-size: 13px; color: var(--paper); line-height: 1.5; }
.choice-tags { display: flex; gap: 4px; flex-wrap: wrap; margin-top: 5px; }

/* outcome */
#outcome { display: none; background: var(--bg2); border: 1px solid rgba(255,255,255,.09); border-radius: var(--r); padding: 1rem 1.1rem; margin-top: .6rem; }
#outcome.on { display: block; }
.out-head { font-size: 10px; text-transform: uppercase; letter-spacing: .15em; margin-bottom: .4rem; }
.out-head.good { color: var(--teal); }
.out-head.bad  { color: var(--red); }
.out-head.neutral { color: var(--gold); }
.out-txt { font-size: 13px; color: var(--aged); line-height: 1.6; margin-bottom: .6rem; }
.out-insight { font-size: 12px; font-style: italic; color: var(--aged); border-left: 2px solid var(--gold); padding: .4rem .7rem; border-radius: 0 4px 4px 0; background: rgba(201,162,39,.06); line-height: 1.5; margin-bottom: .6rem; }

/* buttons */
.btn { border: none; cursor: pointer; font-family: inherit; border-radius: 6px; transition: opacity .13s, transform .1s; }
.btn:active { transform: scale(.97); }
.btn-gold { background: var(--gold); color: #0f0e17; padding: .65rem 1.8rem; font-size: 14px; font-weight: 700; letter-spacing: .03em; }
.btn-gold:hover { opacity: .86; }
.btn-ghost { background: transparent; color: var(--mute); border: 1px solid rgba(255,255,255,.12); padding: .45rem 1.1rem; font-size: 12px; }
.btn-ghost:hover { color: var(--paper); background: rgba(255,255,255,.05); }
.btn-ghost:disabled { opacity: .35; cursor: default; }

/* end */
#end-scr { text-align: center; }
.end-grade { font-size: 5.5rem; font-weight: 900; color: var(--gold); line-height: 1; margin-bottom: .15rem; }
.end-title { font-size: 1.5rem; font-weight: 800; color: var(--paper); margin-bottom: .35rem; }
.end-desc  { font-size: 13px; color: var(--aged); line-height: 1.65; max-width: 460px; margin: 0 auto 1.2rem; }
.end-stats { display: flex; justify-content: center; gap: 1.5rem; margin-bottom: 1.2rem; flex-wrap: wrap; }
.est-val { font-size: 1.7rem; font-weight: 800; color: var(--paper); }
.est-lbl { font-size: 9px; text-transform: uppercase; letter-spacing: .12em; color: var(--mute); margin-top: 1px; }
.end-principles { max-width: 480px; margin: 0 auto 1.3rem; background: rgba(201,162,39,.07); border: 1px solid rgba(201,162,39,.18); border-radius: var(--r); padding: 1rem 1.1rem; text-align: left; }
.ep-lbl { font-size: 9px; text-transform: uppercase; letter-spacing: .16em; color: var(--gold); margin-bottom: .55rem; }
.ep-p { font-size: 12px; color: var(--aged); line-height: 1.6; margin-bottom: .4rem; }
.ep-p:last-child { margin-bottom: 0; }
.end-row { display: flex; justify-content: center; gap: .6rem; flex-wrap: wrap; }
</style>
</head>
<body>
<div id="app">

<!-- ── CHAR SELECT ── -->
<div id="char-scr" class="scr on">
  <div class="char-intro">
    <h1>COALITION<br><span>BUILDER</span></h1>
    <p>Six factions. One city. Who are you?</p>
  </div>
  <div class="char-grid" id="char-grid"></div>
  <div class="start-row">
    <button class="btn btn-gold" id="start-btn" disabled onclick="startGame()">Start →</button>
  </div>
</div>

<!-- ── GAME ── -->
<div id="game-scr" class="scr">
  <div id="hud">
    <div class="hb"><div class="hb-lbl">Coalition</div><div class="hb-val gold" id="h-c">0</div></div>
    <div class="hb"><div class="hb-lbl">Cred</div><div class="hb-val" id="h-cr">50</div></div>
    <div class="hb"><div class="hb-lbl">Mom</div><div class="hb-val" id="h-m">40</div></div>
    <div class="bar-wrap">
      <div class="hb-lbl">Message heat</div>
      <div class="bar-track"><div class="bar-fill rad" id="h-rad" style="width:50%"></div></div>
    </div>
    <div class="bar-wrap">
      <div class="hb-lbl">Pressure</div>
      <div class="bar-track"><div class="bar-fill pres" id="h-pres" style="width:20%"></div></div>
    </div>
    <div class="char-pill"><span id="h-icon">?</span><span id="h-name">—</span></div>
  </div>

  <div class="round-dots" id="rdots"></div>

  <div id="newspaper" class="round-box">
    <div class="np-flag">The Movement Gazette</div>
    <div class="np-hl" id="np-hl"></div>
    <div class="np-sub" id="np-sub"></div>
    <div class="np-body" id="np-body"></div>
    <div class="np-stamp" id="np-stamp"></div>
  </div>

  <div id="pushback">
    <div class="pb-lbl">⚠ The majority pushes back</div>
    <div class="pb-txt" id="pb-txt"></div>
    <div class="pb-btns" id="pb-btns"></div>
    <div class="pb-result" id="pb-result"></div>
  </div>

  <div class="round-box">
    <div class="round-kicker" id="r-kicker"></div>
    <div class="round-title" id="r-title"></div>
    <div class="round-flavor" id="r-flavor"></div>
  </div>

  <div id="faction-map"></div>

  <div class="choices-lbl">Your move</div>
  <div class="choices" id="choices"></div>

  <div id="outcome">
    <div class="out-head" id="out-head"></div>
    <div class="out-txt" id="out-txt"></div>
    <div class="out-insight" id="out-insight"></div>
    <div class="diplo-chips" id="out-chips"></div>
    <button class="btn btn-gold" id="next-btn" onclick="nextRound()">Next →</button>
  </div>
</div>

<!-- ── DIPLO MODAL ── -->
<div id="diplo">
  <div class="diplo-box">
    <div class="diplo-head">
      <div class="diplo-ava" id="d-ava"></div>
      <div><div class="diplo-fname" id="d-name"></div><div class="diplo-fstatus" id="d-stat"></div></div>
    </div>
    <div class="diplo-concern" id="d-concern"></div>
    <div class="diplo-choices" id="d-choices"></div>
    <div class="diplo-result" id="d-result"></div>
    <div class="diplo-insight" id="d-insight"></div>
    <div class="diplo-chips" id="d-chips"></div>
    <button class="btn btn-ghost" onclick="closeDiplo()">Close</button>
  </div>
</div>

<!-- ── END ── -->
<div id="end-scr" class="scr">
  <div class="end-grade" id="eg">B</div>
  <div class="end-title" id="et">Skilled Organizer</div>
  <div class="end-desc" id="ed"></div>
  <div class="end-stats" id="es"></div>
  <div class="end-principles" id="ep"></div>
  <div class="end-row">
    <button class="btn btn-gold" onclick="location.reload()">Play again</button>
  </div>
</div>

</div><!-- #app -->

<script>
// ══════════ DATA ══════════

const CHARS = [
  {id:'pragmatist',icon:'🏛️',name:'Pragmatist',role:'Coalition architect',
   abi:'Trojan horse moves: +8 cred, +1 coalition.',boosts:['trojan'],
   s:{coalition:3,cred:55,mom:35,rad:40}},
  {id:'firebrand',icon:'🔥',name:'Firebrand',role:'Radical organizer',
   abi:'Radical moves never lose momentum.',boosts:['radical'],
   s:{coalition:2,cred:45,mom:60,rad:75}},
  {id:'diplomat',icon:'🤝',name:'Diplomat',role:'Bridge builder',
   abi:'Goldilocks moves: +10 credibility.',boosts:['goldilocks'],
   s:{coalition:4,cred:60,mom:40,rad:35}},
  {id:'strategist',icon:'♟️',name:'Strategist',role:'Tactical operator',
   abi:'Tactical moves store a reserve: +4 all stats next choice.',boosts:['tactical'],
   s:{coalition:3,cred:50,mom:45,rad:50}},
];

const FACTIONS = [
  {id:'progressives',icon:'✊',name:'Progressives',color:'#c0392b',support:70,status:'allied',
   concern:'"No watering down our demands."',
   diplo:[
     {txt:'Invite them to co-write the platform.',tags:['radical'],rhet:'pathos',
      d:{support:+15,cred:+5,pres:+8},q:'mixed',res:'Energy redoubles — but the platform shifts radical.',ins:'Giving radicals authorship raises energy but can shrink the tent.'},
     {txt:'Acknowledge their concerns publicly.',tags:['goldilocks'],rhet:'ethos',
      d:{support:+8,cred:+3,pres:+3},q:'good',res:'Trust deepens. They stay without controlling the message.',ins:'Grant: the message that holds a coalition satisfies no single member fully — and that\'s the sign it\'s working.'},
     {txt:'Ask them to stand down for now.',tags:['tactical'],rhet:'logos',
      d:{support:-12,mom:-5},q:'bad',res:'Offended. Two leaders go public.',ins:'Narcissism of small differences: near-allies fight most bitterly over the small gap between them.'},
   ]},
  {id:'moderates',icon:'⚖️',name:'Moderates',color:'#2a6fa8',support:30,status:'neutral',
   concern:'"Tone it down or we\'re out."',
   diplo:[
     {txt:'Reframe around shared civic values.',tags:['goldilocks'],rhet:'logos',
      d:{support:+20,coalition:+1,cred:+6,pres:-5},q:'good',res:'They endorse. A newspaper follows.',ins:'Common tactics matter more than shared values — that\'s the Trojan horse. Moderate framing opens doors radical language slams shut.'},
     {txt:'Offer them a leadership seat.',tags:['trojan'],rhet:'ethos',
      d:{support:+15,coalition:+1,cred:+3},q:'mixed',res:'They join. Founding members get suspicious.',ins:'Giving insiders a stake converts skeptics — but the core watches closely.'},
     {txt:'Hold the line on the platform.',tags:['radical'],rhet:'pathos',
      d:{support:-5,pres:+6},q:'neutral',res:'They stay neutral — at least they didn\'t leave.',ins:'Too hot repels the center. The Goldilocks zone means actually meeting them partway.'},
   ]},
  {id:'labor',icon:'⚙️',name:'Labor',color:'#b8962e',support:45,status:'neutral',
   concern:'"What\'s in this for workers?"',
   diplo:[
     {txt:'Add a workers\' rights plank.',tags:['goldilocks'],rhet:'logos',
      d:{support:+25,coalition:+1,mom:+5,pres:-4},q:'good',res:'Labor endorses. Their organizers join.',ins:'Shared tactics — not shared values — are what make unlikely alliances work.'},
     {txt:'Promise future collaboration.',tags:['tactical'],rhet:'ethos',
      d:{support:+10},q:'neutral',res:'Tepid but positive. They\'ll watch.',ins:'Credibility without specifics buys time, not commitment.'},
     {txt:'Tell them the bigger picture benefits everyone.',tags:['radical'],rhet:'pathos',
      d:{support:+5,cred:-3,pres:+5},q:'bad',res:'Unconvinced. Feels like talking down to them.',ins:'Pathos without logos backfires with pragmatic audiences.'},
   ]},
  {id:'institutions',icon:'🏛️',name:'Institutions',color:'#6b5fa0',support:10,status:'hostile',
   concern:'"This threatens stability."',

let _ac = null;
function ac(){ if(!_ac){try{_ac=new(window.AudioContext||window.webkitAudioContext)();}catch(e){}} return _ac; }
function tone(f,d,t='sine',v=0.07){ const ctx=ac();if(!ctx)return; const o=ctx.createOscillator(),g=ctx.createGain(); o.connect(g);g.connect(ctx.destination);o.type=t;o.frequency.value=f;g.gain.setValueAtTime(0,ctx.currentTime);g.gain.linearRampToValueAtTime(v,ctx.currentTime+0.01);g.gain.exponentialRampToValueAtTime(.0001,ctx.currentTime+d);o.start();o.stop(ctx.currentTime+d); }
function sfxGood(){tone(440,.1);setTimeout(()=>tone(554,.12),85);setTimeout(()=>tone(659,.18),170);}
function sfxBad(){tone(220,.22,'sawtooth',.05);setTimeout(()=>tone(196,.28,'sawtooth',.04),190);}
function sfxNeu(){tone(330,.14);setTimeout(()=>tone(330,.14),210);}
function sfxClick(){tone(660,.04,.05);}

(function buildChars(){
  const g = document.getElementById('char-grid');
  CHARS.forEach(c => {
    const el = document.createElement('div');
    el.className = 'ccard';
    el.innerHTML = `<div class="ccard-icon">${c.icon}</div><div class="ccard-name">${c.name}</div><div class="ccard-role">${c.role}</div><div class="ccard-abi">${c.abi}</div>`;
    el.onclick = () => {
      sfxClick();
      document.querySelectorAll('.ccard').forEach(x=>x.classList.remove('sel'));
      el.classList.add('sel');
      char = c;
      document.getElementById('start-btn').disabled = false;
    };
    g.appendChild(el);
  });
})();

function startGame(){
  sfxGood();
  S = {coalition:char.s.coalition,cred:char.s.cred,mom:char.s.mom,rad:char.s.rad,pres:20};
  round = 0; choiceDone = false; diploUsed = {}; pbResolved = false;
  document.getElementById('char-scr').classList.remove('on');
  document.getElementById('game-scr').classList.add('on');
  document.getElementById('h-icon').textContent = char.icon;
  document.getElementById('h-name').textContent = char.name;
  updateHUD();
  renderRound();
}

function updateHUD(){
  document.getElementById('h-c').textContent = S.coalition;
  document.getElementById('h-cr').textContent = S.cred;
  document.getElementById('h-m').textContent = S.mom;
  document.getElementById('h-rad').style.width = clamp(S.rad,5,95)+'%';
  document.getElementById('h-pres').style.width = clamp(S.pres||0,0,100)+'%';
}
function clamp(v,mn,mx){return Math.max(mn,Math.min(mx,v));}

function showNewspaper(r, q){
  const np = document.getElementById('newspaper');
  if(!q||!r.newspaper){ np.classList.remove('on'); return; }
  const n = r.newspaper;
  document.getElementById('np-hl').textContent = q==='good'?n.hl_good:q==='bad'?n.hl_bad:n.hl_neu;
  document.getElementById('np-sub').textContent = q==='good'?n.sub_good:q==='bad'?n.sub_bad:n.sub_neu;
  document.getElementById('np-body').textContent = (q==='good'?n.body_good:q==='bad'?n.body_bad:n.body_neu)+' Coalition now at '+S.coalition+' groups.';
  const st = document.getElementById('np-stamp');
  st.textContent = q==='good'?'Favorable':q==='bad'?'Hostile':'Neutral';
  st.className = 'np-stamp '+(q==='good'?'fav':q==='bad'?'hos':'neu');
  np.classList.add('on');
}

function tryPushback(){
  const pb = document.getElementById('pushback');
  if(S.pres < 40 || round === 0){ pb.classList.remove('on'); return; }
  if(round % 2 !== 0){ pb.classList.remove('on'); return; }
  pbResolved = false;
  const ev = PUSHBACK_EVENTS[Math.min(Math.floor(round/2), PUSHBACK_EVENTS.length-1)];
  document.getElementById('pb-txt').textContent = ev.txt;
  const btns = document.getElementById('pb-btns');
  btns.innerHTML='';
  document.getElementById('pb-result').classList.remove('on');
  ev.opts.forEach(o => {
    const b = document.createElement('button');
    b.className='pb-btn'; b.textContent=o.txt;
    b.onclick=()=>resolvePB(o,ev);
    btns.appendChild(b);
  });
  pb.classList.add('on');
}
function resolvePB(opt,ev){
  sfxClick();
  pbResolved=true;
  document.querySelectorAll('.pb-btn').forEach(b=>{b.disabled=true;b.style.opacity='.4';});
  applyDelta(opt.d);
  updateHUD();
  const res=document.getElementById('pb-result');
  res.textContent=opt.r; res.classList.add('on');
}

function buildFactionMap(){
  const map = document.getElementById('faction-map');
  map.innerHTML='';
  FACTIONS.forEach(f=>{
    const el=document.createElement('div');
    el.className='fcard '+(f.status==='allied'?'allied':f.status==='hostile'?'hostile':'')+(diploUsed[f.id]?' used':'');
    el.innerHTML=`<div class="fcard-top"><div class="fcard-icon">${f.icon}</div><div><div class="fcard-name">${f.name}</div><div class="fcard-status" style="color:${f.status==='allied'?'#1a9a80':f.status==='hostile'?'#c0392b':'#6a6070'}">${f.status==='allied'?'✓ Allied':f.status==='hostile'?'✗ Hostile':'◌ Neutral'}</div></div></div><div class="fcard-bar"><div class="fcard-fill" style="width:${f.support}%"></div></div>`;
    if(!diploUsed[f.id]) el.onclick=()=>openDiplo(f);
    map.appendChild(el);
  });
}

function openDiplo(f){
  sfxClick();
  const modal=document.getElementById('diplo');
  document.getElementById('d-ava').textContent=f.icon;
  document.getElementById('d-ava').style.background=f.color+'33';
  document.getElementById('d-name').textContent=f.name;
  const sc={allied:'color:#1a9a80',hostile:'color:#c0392b',neutral:'color:#6a6070'};
  document.getElementById('d-stat').style=sc[f.status]||'';
  document.getElementById('d-stat').textContent=f.status==='allied'?'✓ Allied':f.status==='hostile'?'✗ Hostile':'◌ Neutral';
  document.getElementById('d-concern').textContent=f.concern;
  document.getElementById('d-result').classList.remove('on');
  document.getElementById('d-insight').classList.remove('on');
  document.getElementById('d-chips').innerHTML='';
  const dc=document.getElementById('d-choices');
  dc.innerHTML='';
  f.diplo.forEach(c=>{
    const btn=document.createElement('button');
    btn.className='dchoice';
    const tm={goldilocks:'dtag-gold',radical:'dtag-rad',trojan:'dtag-troj',tactical:'dtag-tact'};
    const tl={goldilocks:'Goldilocks',radical:'Radical',trojan:'Trojan',tactical:'Tactical'};
    const rm={ethos:'dtag-eth',pathos:'dtag-pat',logos:'dtag-log'};
    const rl={ethos:'Ethos',pathos:'Pathos',logos:'Logos'};
    const tags=c.tags.map(t=>`<span class="dtag ${tm[t]||''}">${tl[t]||t}</span>`).join('');
    const rhet=`<span class="dtag ${rm[c.rhet]||''}">${rl[c.rhet]||c.rhet}</span>`;
    btn.innerHTML=`<div style="margin-bottom:4px">${c.txt}</div><div class="dchoice-tags">${tags}${rhet}</div>`;
    btn.onclick=()=>resolveDiplo(f,c);
    dc.appendChild(btn);
  });
  modal.classList.add('on');
}
function resolveDiplo(f,c){
  sfxClick();
  diploUsed[f.id]=true;
  const d={...c.d};
  const boosted=char.boosts.some(b=>c.tags.includes(b));
  if(boosted){ if(d.cred) d.cred=Math.round(d.cred*1.3); if(d.coalition&&d.coalition>0) d.coalition++; }
  applyDelta(d);
  if(d.support){ const fac=FACTIONS.find(x=>x.id===f.id); fac.support=clamp(fac.support+d.support,0,100); if(fac.support>=65) fac.status='allied'; if(fac.support<30&&fac.status==='allied') fac.status='neutral'; }
  updateHUD(); buildFactionMap();
  document.querySelectorAll('.dchoice').forEach(b=>{b.disabled=true;b.style.opacity='.4';});
  const res=document.getElementById('d-result'); res.textContent=c.res; res.classList.add('on');
  const ins=document.getElementById('d-insight'); ins.textContent='"'+c.ins+'"'; ins.classList.add('on');
  const chips=document.getElementById('d-chips'); chips.innerHTML='';
  showChips(chips,[{l:'Coalition',v:d.coalition},{l:'Cred',v:d.cred},{l:'Mom',v:d.mom}]);
  if(boosted){const b=document.createElement('span');b.className='dchip pos';b.textContent='★ Leader bonus';chips.appendChild(b);}
  if(c.q==='good') sfxGood(); else if(c.q==='bad') sfxBad(); else sfxNeu();
}
function closeDiplo(){ document.getElementById('diplo').classList.remove('on'); }

// ══════════════════════════════════════
//  ROUND RENDER
// ══════════════════════════════════════
function renderRound(){
  choiceDone=false;
  const r=ROUNDS[round];
  // dots
  const dots=document.getElementById('rdots'); dots.innerHTML='';
  ROUNDS.forEach((_,i)=>{ const d=document.createElement('div'); d.className='rd'+(i<round?' done':i===round?' cur':''); dots.appendChild(d); });
  // newspaper from last round
  if(round>0&&S._lastQ) showNewspaper(ROUNDS[round-1],S._lastQ);
  else document.getElementById('newspaper').classList.remove('on');
  // pushback
  tryPushback();
  // round header
  document.getElementById('r-kicker').textContent=r.kicker;
  document.getElementById('r-title').textContent=r.title;
  document.getElementById('r-flavor').textContent=r.flavor;
  // faction map
  buildFactionMap();
  // choices
  const cw=document.getElementById('choices'); cw.innerHTML='';
  r.choices.forEach(c=>{
    const btn=document.createElement('div'); btn.className='choice'+(char.boosts.some(b=>c.tags.includes(b))?' boosted':'');
    const tm={goldilocks:'dtag-gold',radical:'dtag-rad',trojan:'dtag-troj',tactical:'dtag-tact'};
    const tl={goldilocks:'Goldilocks',radical:'Radical',trojan:'Trojan',tactical:'Tactical'};
    const rm={ethos:'dtag-eth',pathos:'dtag-pat',logos:'dtag-log'};
    const rl={ethos:'Ethos',pathos:'Pathos',logos:'Logos'};
    const tags=c.tags.map(t=>`<span class="dtag ${tm[t]||''}">${tl[t]||t}</span>`).join('');
    const rhet=`<span class="dtag ${rm[c.rhet]||''}">${rl[c.rhet]||c.rhet}</span>`;
    btn.innerHTML=`<span class="choice-letter">${c.letter}.</span><span class="choice-text">${c.txt}</span><div class="choice-tags">${tags}${rhet}</div>`;
    btn.onclick=()=>makeChoice(c);
    cw.appendChild(btn);
  });
  document.getElementById('outcome').classList.remove('on');
}

// ══════════════════════════════════════
//  CHOICE
// ══════════════════════════════════════
function makeChoice(c){
  if(choiceDone) return;
  choiceDone=true;
  sfxClick();
  document.querySelectorAll('.choice').forEach(b=>{b.style.opacity='.4';b.style.pointerEvents='none';});
  const o=c.o; const d={...o.d};
  const boosted=char.boosts.some(b=>c.tags.includes(b));
  if(boosted){ if(d.cred) d.cred=Math.round(d.cred*1.3); if(d.coalition&&d.coalition>0) d.coalition++; }
  applyDelta(d);
  // pressure from strategy
  if(c.tags.includes('radical')) S.pres=clamp((S.pres||20)+8,0,100);
  if(c.tags.includes('trojan')||c.tags.includes('goldilocks')) S.pres=clamp((S.pres||20)-5,0,100);
  if(o.q==='bad') S.pres=clamp((S.pres||20)+8,0,100);
  S._lastQ=o.q;
  updateHUD();
  // faction nudge
  if(o.q==='good'){ const ns=FACTIONS.filter(f=>f.status==='neutral'); if(ns.length){ns[0].support=clamp(ns[0].support+18,0,100);if(ns[0].support>=65)ns[0].status='allied';} }
  if(o.q==='bad'){ const as=FACTIONS.filter(f=>f.status==='allied'); if(as.length>1){as[as.length-1].support=clamp(as[as.length-1].support-18,0,100);if(as[as.length-1].support<35)as[as.length-1].status='neutral';} }
  buildFactionMap();
  // outcome
  const oh=document.getElementById('out-head'); oh.textContent=o.head; oh.className='out-head '+o.q;
  document.getElementById('out-txt').textContent=o.txt;
  document.getElementById('out-insight').textContent='"'+o.ins+'"';
  const chips=document.getElementById('out-chips'); chips.innerHTML='';
  showChips(chips,[{l:'Coalition',v:d.coalition},{l:'Cred',v:d.cred},{l:'Mom',v:d.mom}]);
  if(boosted){const b=document.createElement('span');b.className='dchip pos';b.textContent='★ Leader bonus';chips.appendChild(b);}
  document.getElementById('next-btn').textContent=round<ROUNDS.length-1?'Next round →':'See results →';
  document.getElementById('outcome').classList.add('on');
  document.getElementById('outcome').scrollIntoView({behavior:'smooth',block:'nearest'});
  if(o.q==='good') sfxGood(); else if(o.q==='bad') sfxBad(); else sfxNeu();
}

function nextRound(){
  sfxClick();
  round++;
  if(round>=ROUNDS.length){ showEnd(); return; }
  renderRound();
  document.getElementById('rdots').scrollIntoView({behavior:'smooth'});
}

// ══════════════════════════════════════
//  HELPERS
// ══════════════════════════════════════
function applyDelta(d){
  if(d.coalition!==undefined) S.coalition=Math.max(0,S.coalition+(d.coalition||0));
  if(d.cred!==undefined) S.cred=clamp(S.cred+(d.cred||0),0,100);
  if(d.mom!==undefined) S.mom=clamp(S.mom+(d.mom||0),0,100);
  if(d.rad!==undefined) S.rad=clamp(S.rad+(d.rad||0),5,95);
  if(d.pres!==undefined) S.pres=clamp((S.pres||20)+(d.pres||0),0,100);
}
function showChips(el,arr){
  arr.forEach(x=>{ if(!x.v) return; const c=document.createElement('span'); c.className='dchip '+(x.v>0?'pos':'neg'); c.textContent=`${x.l} ${x.v>0?'+':''}${x.v}`; el.appendChild(c); });
}

// ══════════════════════════════════════
//  END
// ══════════════════════════════════════
function showEnd(){
  document.getElementById('game-scr').classList.remove('on');
  document.getElementById('end-scr').classList.add('on');
  const total=S.coalition*15+S.cred*0.5+S.mom*0.5;
  const allied=FACTIONS.filter(f=>f.status==='allied').length;
  let grade,title,desc;
  if(total>=95){grade='A+';title='Master Coalition Builder';desc='You played the Goldilocks zone, deployed the Trojan horse, and avoided the narcissism trap. The movement is positioned to win. Lucy Stone would approve.';}
  else if(total>=80){grade='A';title='Skilled Organizer';desc='Strong coalition, strong credibility. A few missteps but the movement is intact and growing.';}
  else if(total>=65){grade='B';title='Competent Leader';desc='You built something real but left opportunity on the table. The narcissism trap and a few too-hot moments cost you.';}
  else if(total>=45){grade='C';title='Learning the Hard Way';desc='The coalition exists but is fragile. The Goldilocks tension is genuinely hard — most movements fail here.';}
  else{grade='D';title='The Movement Fractured';desc='Majority pressure overwhelmed you. Revisit Grant\'s key moves: Goldilocks messaging, Trojan horse access, and converting frenemies over fighting them.';}
  document.getElementById('eg').textContent=grade;
  document.getElementById('et').textContent=title;
  document.getElementById('ed').textContent=desc;
  document.getElementById('es').innerHTML=`
    <div><div class="est-val">${S.coalition}</div><div class="est-lbl">Coalition</div></div>
    <div><div class="est-val">${S.cred}</div><div class="est-lbl">Credibility</div></div>
    <div><div class="est-val" style="color:#1a9a80">${allied}</div><div class="est-lbl">Allied factions</div></div>
    <div><div class="est-val" style="color:#c0392b">${S.pres}%</div><div class="est-lbl">Pressure survived</div></div>`;
  document.getElementById('ep').innerHTML=`
    <div class="ep-lbl">What the chapter actually says</div>
    <p class="ep-p"><strong style="color:#f0ebe0">Goldilocks theory (p.117):</strong> Founders are the most radical members. The message to draw allies must be neither too hot nor too cold — one that satisfies no single member fully but dissatisfies none enough to leave.</p>
    <p class="ep-p"><strong style="color:#f0ebe0">Narcissism of small differences (p.116):</strong> Movements that are 80% aligned fight most bitterly over the 20% gap. Anthony and Stanton literally wrote Stone out of the history of the suffrage movement.</p>
    <p class="ep-p"><strong style="color:#f0ebe0">Trojan horse:</strong> When direct entry is blocked, work through internal advocates. Change from within reads as authentic — not imposed from outside.</p>
    <p class="ep-p"><strong style="color:#f0ebe0">Common tactics &gt; shared values:</strong> Unlikely allies can cooperate on shared action even when deeper values differ. Western states won suffrage earlier partly through this kind of pragmatic alliance-building.</p>`;
  sfxGood();
}
</script>
